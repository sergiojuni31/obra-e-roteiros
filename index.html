<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#141619">
<title>Estúdio Obra & Ciência</title>
<style>
:root{--bg:#141619;--bg2:#1c1f23;--bg3:#262a2f;--tx:#EAE8E3;--q:#FF5A1F;--c:#00A8E8;--g:#9b9991;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--bg3)}
.logo{font-weight:700;margin-right:auto;white-space:nowrap;letter-spacing:.02em}
nav a{color:var(--g);text-decoration:none;padding:6px 10px;border-radius:6px;font-family:var(--mono);font-size:13px}
nav a.on{color:var(--tx);background:var(--bg3)}
main{max-width:900px;margin:0 auto;padding:12px 12px 60px}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea,select{width:100%;background:var(--bg2);border:1px solid var(--bg3);border-radius:6px;padding:8px}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:1px solid var(--c)}
button,.btn{background:var(--bg3);border:1px solid #33383e;border-radius:6px;padding:7px 12px;cursor:pointer;color:var(--tx);text-decoration:none;display:inline-block}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--c);border-color:var(--c);color:#06131a;font-weight:600}
button.q{border-color:var(--q);color:var(--q)}
button.mini{padding:3px 8px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 140px}
.row>.fix{flex:0 0 auto}
.card{background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:12px;margin:8px 0}
.card.click{cursor:pointer}
.lbl{font-family:var(--mono);font-size:11px;color:var(--g);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px}
.tag{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:4px;background:var(--bg3);color:var(--g);margin:2px 4px 2px 0;display:inline-block}
.tag.q{color:var(--q);border:1px solid var(--q);background:none}
.tag.c{color:var(--c);border:1px solid var(--c);background:none}
.muted{color:var(--g);font-size:13px}
h2,h3{margin:14px 0 6px}
.bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin:6px 0}
.bar>div{height:100%;background:var(--c)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:10px 0;padding-bottom:4px}
.tabs button{white-space:nowrap;font-family:var(--mono);font-size:12px}
.tabs button.on{border-color:var(--q);color:var(--q)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{width:150px;background:var(--bg3);border-radius:6px;overflow:hidden;position:relative}
.thumb img{width:100%;height:105px;object-fit:cover;display:block;cursor:zoom-in;background:#0c0d0f}
.thumb input{border:0;border-radius:0;font-size:12px;padding:5px 6px}
.thumb .x{position:absolute;top:4px;right:4px}
.etapa{border-left:3px solid var(--bg3);padding:8px 10px;margin:8px 0;background:var(--bg2);border-radius:0 8px 8px 0}
.etapa.atual{border-left-color:var(--q)}
.etapa.ok{border-left-color:var(--c)}
.etapa.na{opacity:.6}
.etapa h4{margin:0 0 6px;display:flex;gap:8px;align-items:center;font-size:15px;flex-wrap:wrap}
.etapa.atual h4{color:var(--q)}
.item{display:flex;align-items:center;gap:6px;padding:5px 0;border-top:1px solid var(--bg3)}
.item .t{flex:1}
.item.feito .t{color:var(--c)}
.item.nao_se_aplica .t{color:var(--g);text-decoration:line-through}
.item.pulado .t{color:var(--q)}
.st{display:flex;gap:3px}
.st button{padding:2px 7px;font-size:11px;font-family:var(--mono)}
.st button.on.feito{background:var(--c);color:#06131a;border-color:var(--c)}
.st button.on.nao_se_aplica{background:var(--g);color:#141619;border-color:var(--g)}
.st button.on.pulado{border-color:var(--q);color:var(--q)}
.aviso{border:1px solid var(--q);color:var(--q);padding:8px 10px;border-radius:6px;margin:8px 0}
#sync-status{width:14px;height:14px;padding:0;border-radius:50%;border:none;background:var(--g);flex:none}
#sync-status[data-estado=ok]{background:var(--c)}
#sync-status[data-estado=pendente]{background:var(--q)}
#sync-status[data-estado=sincronizando]{background:var(--c);animation:pulsa 1s infinite}
@keyframes pulsa{50%{opacity:.3}}
#zoom{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:20}
#zoom img{max-width:96vw;max-height:96vh}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--c);padding:8px 14px;border-radius:6px;display:none;z-index:30}
a{color:var(--c)}
.row>.selbox,.selbox{flex:0 0 34px;display:flex;align-items:center;justify-content:center;min-height:34px;margin:-6px 2px -6px -6px;cursor:pointer}
.selbox input{width:18px;height:18px;padding:0;accent-color:#FF5A1F;cursor:pointer}
.card.marcado{border-color:var(--q)}
#barra-sel{position:sticky;top:46px;z-index:4;display:none;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--q);border-radius:8px;padding:8px 10px;margin:8px 0;font-family:var(--mono);font-size:13px}
#barra-sel span{margin-right:auto;color:var(--q)}
</style>
</head>
<body>
<header>
  <div class="logo">OBRA <span style="color:var(--q)">&amp;</span> <span style="color:var(--c)">CIÊNCIA</span></div>
  <nav><a href="#ideias" id="n-ideias">Ideias</a><a href="#projetos" id="n-projetos">Projetos</a><a href="#config" id="n-config">Config</a></nav>
  <button id="sync-status" data-estado="offline" title="Modo offline"></button>
</header>
<main id="app"></main>
<input type="file" id="arquivo" accept="image/*" multiple hidden>
<input type="file" id="arquivo-json" accept=".json,application/json" hidden>
<div id="zoom"></div><div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
// ================= CONSTANTES =================
const ORIGENS=['outlier','tendência','busca','comentário','própria'];
const STATUS_IDEIA=['nova','analisando','virou projeto','descartada'];
const COR_STATUS={nova:'q',analisando:'q','virou projeto':'c',descartada:''};
const ETAPAS=[
 ['Validação',['Outlier ou tendência que justifica o tema','Busca real (autocompletar, Google Trends)','Timing definido (data-alvo)','Ângulo próprio do canal definido','Encaixe no nicho (cultura pop só como porta de entrada)']],
 ['Pesquisa e fontes',['Fontes principais reunidas','Concorrentes que já fizeram o tema assistidos','Virada narrativa identificada']],
 ['Checagem na fonte original',['Todo número ligado a uma fonte','Dados secundários confirmados na origem','Estimativas marcadas como estimativa']],
 ['Roteiro',['Gancho de até 40 s','Blocos escritos','Marcações de edição e SFX','Leitura em voz alta e cortes','Fecho com gancho para o próximo vídeo']],
 ['Experimento de bancada',['Maquetes impressas','Teste de controle','Medição em mais de um dia','Gráfico com os dados reais']],
 ['Renders e animações',['Lista de cenas','Modelagem no SketchUp','Renders no V-Ray','Gráficos na paleta térmica']],
 ['Narração',['Gravação','Limpeza do áudio']],
 ['Edição',['Corte bruto','Inserção de visuais e memes','Trilha da Biblioteca de Áudio do YouTube','Legendas','Revisão final assistindo inteiro']],
 ['Miniaturas',['3 variações criadas','Legibilidade conferida em tamanho pequeno']],
 ['Título, descrição e capítulos',['3 títulos para teste','Descrição com fontes','Capítulos','Links de afiliado']],
 ['Publicação',['Categoria Educação','Playlist do pilar','Teste de título/miniatura ativado','Tela final indicando vídeo técnico','Shorts de divulgação']],
 ['Métricas e lições',['Números de 48 h','Números de 7 dias','Números de 28 dias','Lições registradas','Planilha de outliers e plano de ação atualizados']]
];
const ROTULO_EST={feito:'✓',nao_se_aplica:'N/A',pulado:'Pular'};
const ABAS=[['resumo','Resumo'],['checklist','Checklist'],['fontes','Fontes'],['checagem','Checagem'],['roteiro','Roteiro'],['galeria','Galeria'],['miniaturas','Miniaturas'],['diario','Diário'],['metricas','Métricas']];
const MOTIVO_SEM_EXP='Vídeo sem experimento';

// ================= UTILITÁRIOS =================
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const agora=()=>new Date().toISOString();
const hoje=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const diasAte=d=>Math.round((new Date(d+'T00:00:00')-new Date(hoje()+'T00:00:00'))/864e5);
const fmtData=d=>d?d.split('-').reverse().join('/'):'';
const textoPrazo=d=>d<0?`atrasado ${-d} dia(s)`:d===0?'é hoje':`faltam ${d} dia(s)`;
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'projeto';
const uuid=()=>crypto.randomUUID?crypto.randomUUID():([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200);}
function baixar(texto,nome){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([texto],{type:'application/json'}));a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
const blobParaDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});
function setPath(o,p,v){const ks=p.split('.');let x=o;for(let i=0;i<ks.length-1;i++)x=(x[ks[i]]??={});x[ks[ks.length-1]]=v;}
const opts=(lista,val,primeiro)=>(primeiro!=null?`<option value="">${esc(primeiro)}</option>`:'')+lista.map(o=>`<option value="${esc(o)}"${o===val?' selected':''}>${esc(o)}</option>`).join('');
const sel=(id,lista,val,primeiro)=>`<select id="${id}">${opts(lista,val,primeiro)}</select>`;
const selK=(k,lista,val,primeiro)=>`<select data-k="${k}">${opts(lista,val,primeiro)}</select>`;
const linksHtml=ls=>(ls||[]).filter(l=>/^https?:\/\//i.test(l)).map(l=>`<a href="${esc(l)}" target="_blank" rel="noopener">${esc(l.length>70?l.slice(0,70)+'…':l)}</a>`).join('<br>');

// ================= INDEXEDDB =================
let _db;
function getDB(){return _db??=new Promise((res,rej)=>{const r=indexedDB.open('estudio_oc',1);
 r.onupgradeneeded=()=>{const db=r.result;db.createObjectStore('itens',{keyPath:'id'});db.createObjectStore('anexos',{keyPath:'id'});db.createObjectStore('fila_sync',{keyPath:'chave'});db.createObjectStore('config',{keyPath:'chave'});};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function tx(store,modo,fn){return getDB().then(db=>new Promise((res,rej)=>{const t=db.transaction(store,modo);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r?r.result:undefined);t.onerror=()=>rej(t.error);}));}
const DB={get:(s,k)=>tx(s,'readonly',o=>o.get(k)),put:(s,v)=>tx(s,'readwrite',o=>o.put(v)),del:(s,k)=>tx(s,'readwrite',o=>o.delete(k)),all:s=>tx(s,'readonly',o=>o.getAll())};

// ================= SINCRONIZAÇÃO (Supabase) =================
const Sync=(()=>{
 const MARGEM_MS=5*60*1000,INTERVALO_MS=3*60*1000,PAG=500;
 let sb=null,rodando=false,timer=null,timerEnvio=null;
 const ts=d=>Date.parse(d)||0;
 function validar(url,key){
  if(!/^https:\/\/.+/.test(url))throw new Error('A URL deve começar com https://');
  if(!key)throw new Error('Cole a chave publishable.');
  if(key.startsWith('sb_secret_'))throw new Error('Essa é a chave SECRETA. Use a publishable (sb_publishable_...).');
  if(key.split('.').length===3){let p={};try{p=JSON.parse(atob(key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));}catch{}
   if(p.role==='service_role')throw new Error('Chave service_role recusada. Use a anon/publishable.');}
 }
 const criar=(url,key)=>typeof supabase==='undefined'?null:supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true}});
 async function sessao(){if(!sb)return null;try{const {data}=await sb.auth.getSession();return data.session;}catch{return null;}}
 const TXT={ok:'Sincronizado',pendente:'Alterações pendentes',offline:'Modo offline / sync desligado',sincronizando:'Sincronizando…'};
 function status(e){const el=$('#sync-status');el.dataset.estado=e;el.title=TXT[e];}
 async function atualizarStatus(){if(rodando)return;const s=await sessao();if(!s)return status('offline');
  const pend=(await DB.all('fila_sync')).length;status(pend?'pendente':navigator.onLine?'ok':'offline');}
 async function marcar(tipo,id){await DB.put('fila_sync',{chave:`${tipo}:${id}`,tipo,id,em:Date.now()});atualizarStatus();
  clearTimeout(timerEnvio);timerEnvio=setTimeout(sincronizar,5000);}
 async function tirarDaFila(f){const a=await DB.get('fila_sync',f.chave);if(a&&a.em===f.em)await DB.del('fila_sync',f.chave);}
 async function puxar(){
  const reg=await DB.get('config','ultimo_sync');
  const desde=reg?.valor?new Date(ts(reg.valor)-MARGEM_MS).toISOString():'1970-01-01T00:00:00Z';
  let maior=reg?.valor||null,de=0,mudou=false;
  while(true){
   const {data,error}=await sb.from('itens').select('*').gt('atualizado_em',desde).order('atualizado_em').range(de,de+PAG-1);
   if(error)throw error;
   for(const r of data){
    if(!maior||ts(r.atualizado_em)>ts(maior))maior=r.atualizado_em;
    const local=await DB.get('itens',r.id);
    if(local&&ts(local.atualizado_em)>=ts(r.atualizado_em))continue;
    await DB.put('itens',{...r.dados,id:r.id,tipo:r.tipo,atualizado_em:r.atualizado_em,apagado:r.apagado});
    const pend=await DB.get('fila_sync',`item:${r.id}`);if(pend)await DB.del('fila_sync',pend.chave);
    mudou=true;
   }
   if(data.length<PAG)break;de+=PAG;
  }
  if(maior)await DB.put('config',{chave:'ultimo_sync',valor:maior});
  if(mudou)window.dispatchEvent(new CustomEvent('sync:atualizado'));
 }
 async function enviar(uid){
  const fila=await DB.all('fila_sync');
  for(const f of fila.filter(f=>f.tipo==='anexo')){
   const a=await DB.get('anexos',f.id);if(!a?.blob){await DB.del('fila_sync',f.chave);continue;}
   const {error}=await sb.storage.from('anexos').upload(`${uid}/${f.id}.webp`,a.blob,{upsert:true,contentType:'image/webp'});
   if(error){console.warn('[sync] anexo',f.id,error.message);continue;}
   await tirarDaFila(f);
  }
  const fi=fila.filter(f=>f.tipo==='item');
  for(let i=0;i<fi.length;i+=200){
   const lote=[],fs=[];
   for(const f of fi.slice(i,i+200)){const it=await DB.get('itens',f.id);if(!it){await DB.del('fila_sync',f.chave);continue;}
    lote.push({id:it.id,user_id:uid,tipo:it.tipo,dados:it,atualizado_em:it.atualizado_em,apagado:!!it.apagado});fs.push(f);}
   if(!lote.length)continue;
   const {error}=await sb.from('itens').upsert(lote,{onConflict:'id'});if(error)throw error;
   for(const f of fs)await tirarDaFila(f);
  }
 }
 async function sincronizar(){
  if(rodando)return false;
  if(!sb||!navigator.onLine){atualizarStatus();return false;}
  const s=await sessao();if(!s){atualizarStatus();return false;}
  rodando=true;status('sincronizando');let ok=true;
  try{await puxar();await enviar(s.user.id);}catch(e){console.error('[sync]',e);ok=false;}
  finally{rodando=false;await atualizarStatus();}
  return ok;
 }
 async function obterAnexo(id){
  const local=await DB.get('anexos',id);if(local?.blob)return local.blob;
  const s=navigator.onLine&&await sessao();if(!s)return null;
  try{const {data,error}=await sb.storage.from('anexos').createSignedUrl(`${s.user.id}/${id}.webp`,60);if(error)return null;
   const r=await fetch(data.signedUrl);if(!r.ok)return null;const blob=await r.blob();
   await DB.put('anexos',{...(local||{}),id,blob});return blob;}catch{return null;}
 }
 function agendar(){clearInterval(timer);timer=setInterval(sincronizar,INTERVALO_MS);}
 async function configurar(url,key){url=url.trim();key=key.trim();validar(url,key);
  await DB.put('config',{chave:'supabase',url,key});sb=criar(url,key);
  if(!sb)throw new Error('Configuração salva, mas a biblioteca do Supabase não carregou. Confira a internet e recarregue.');}
 async function entrar(email,senha){if(!sb)throw new Error('Salve a URL e a chave primeiro.');
  const {error}=await sb.auth.signInWithPassword({email,password:senha});if(error)throw error;agendar();await sincronizar();}
 async function sair(){try{await sb?.auth.signOut();}catch{}clearInterval(timer);atualizarStatus();}
 async function iniciar(){const cfg=await DB.get('config','supabase');if(cfg?.url&&cfg?.key)sb=criar(cfg.url,cfg.key);
  if(await sessao()){agendar();sincronizar();}else atualizarStatus();}
 window.addEventListener('online',sincronizar);
 window.addEventListener('offline',atualizarStatus);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sincronizar();});
 return {iniciar,configurar,entrar,sair,sincronizar,obterAnexo,
  marcarItem:id=>marcar('item',id),marcarAnexo:id=>marcar('anexo',id),
  logado:async()=>(await sessao())?.user?.email||null};
})();

// ================= DADOS =================
async function salvar(item){item.atualizado_em=agora();await DB.put('itens',item);await Sync.marcarItem(item.id);}
const pendSalvar=new Map();
function salvarDepois(item){clearTimeout(pendSalvar.get(item.id)?.t);pendSalvar.set(item.id,{item,t:setTimeout(()=>{pendSalvar.delete(item.id);salvar(item);},500)});}
function salvarPendentes(){for(const [,p] of pendSalvar){clearTimeout(p.t);salvar(p.item);}pendSalvar.clear();}
async function apagar(item){item.apagado=true;await salvar(item);}
async function itensAtivos(tipo){return (await DB.all('itens')).map(normalizar).filter(i=>i&&!i.apagado&&(!tipo||i.tipo===tipo));}
async function listaPilares(){return [...new Set((await itensAtivos()).map(i=>i.pilar).filter(Boolean))].sort();}

function novaIdeia(base={}){const t=agora();return {id:uuid(),tipo:'ideia',titulo:'',nota:'',links:[],prints:[],pilar:'',tags:[],origem:'própria',status:'nova',origem_id:null,projeto_id:null,criado_em:t,atualizado_em:t,apagado:false,...base};}
function novoProjeto(base={}){const t=agora();return {id:uuid(),tipo:'projeto',titulo:'',titulos_alt:[],pilar:'',tipo_video:'perene',formato:'com experimento',data_alvo:'',ideia_id:null,origem_id:null,
 checklist:ETAPAS.map(([nome,itens],i)=>({n:i+1,nome,motivo:'',itens:itens.map(t=>({t,estado:'pendente',motivo:''}))})),
 fontes:[],checagem:[],roteiro:['Gancho','Promessa','Bloco 1','Fecho'].map(b=>({bloco:b,narracao:'',marcacoes:'',duracao:null})),
 galeria:[],miniaturas:[],diario:[],metricas:{h48:'',d7:'',d28:'',licoes:''},criado_em:t,atualizado_em:t,apagado:false,...base};}

function calc(p){let feitos=0,total=0,na=0,pul=0,atual=null;const pulados=[];
 for(const e of p.checklist)for(const it of e.itens){total++;
  if(it.estado==='feito')feitos++;
  else if(it.estado==='nao_se_aplica')na++;
  else if(it.estado==='pulado'){pul++;pulados.push(`${e.n}. ${e.nome} › ${it.t}${it.motivo?` (motivo: ${it.motivo})`:e.motivo?` (motivo: ${e.motivo})`:''}`);}
  else if(!atual)atual=e;}
 const base=total-na-pul;return {feitos,total,na,pul,base,pct:base?Math.round(feitos/base*100):100,atual,pulados};}

function aplicarFormato(p){const e=p.checklist[4];
 if(p.formato==='sem experimento'&&e.itens.every(i=>i.estado==='pendente')){e.itens.forEach(i=>i.estado='nao_se_aplica');e.motivo=MOTIVO_SEM_EXP;}
 if(p.formato==='com experimento'&&e.motivo===MOTIVO_SEM_EXP){e.itens.forEach(i=>{if(i.estado==='nao_se_aplica')i.estado='pendente';});e.motivo='';}}

// ================= IMAGENS =================
async function processarImagem(file){
 const bmp=await createImageBitmap(file);const k=Math.min(1,1600/bmp.width);
 const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
 c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(r,'image/webp',0.8));}

function campo(k,t,l,v,ops,p){
 const L=`<div class="lbl">${esc(l)}</div>`;
 if(t==='textarea')return L+`<textarea data-k="${k}">${esc(v)}</textarea>`;
 if(t==='select')return L+selK(k,ops,v,'—');
 if(t==='check')return `<label class="row" style="margin-top:8px;flex-wrap:nowrap"><input type="checkbox" data-k="${k}" ${v?'checked':''} style="width:auto;flex:none"><span>${esc(l)}</span></label>`;
 if(t==='num')return L+`<input type="number" min="0" data-k="${k}" data-t="num" value="${v??''}">`;
 if(t==='date')return L+`<input type="date" data-k="${k}" value="${esc(v)}">`;
 if(t==='fonte')return L+`<select data-k="${k}"><option value="">— sem fonte —</option>${(p.fontes||[]).map(f=>`<option value="${f.id}"${f.id===v?' selected':''}>${esc((f.descricao||f.link||'(fonte sem nome)').slice(0,80))}</option>`).join('')}</select>`;
 if(t==='img'){const i=k.split('.')[1];return L+(v?`<div class="thumb"><img data-anexo="${v}" alt=""></div>`:'')+`<button class="mini" data-a="imgMini" data-i="${i}" style="margin-top:4px">${v?'Trocar imagem':'Escolher imagem'}</button>`;}

}

function normalizar(i){
 if(!i||typeof i!=='object')return i;
 const base=i.tipo==='projeto'?novoProjeto():novaIdeia();
 for(const [k,v] of Object.entries(base)){
  if(i[k]===undefined)i[k]=v;
  else if(Array.isArray(v)&&!Array.isArray(i[k]))i[k]=v;
  else if(v&&typeof v==='object'&&!Array.isArray(v)&&(typeof i[k]!=='object'||i[k]===null))i[k]=v;
 }
 return i;
}

  const ideia=normalizar(await DB.get('itens',it.ideia_id));
  if(ideia&&!ideia.apagado&&ideia.projeto_id===it.id){ideia.projeto_id=null;ideia.status='analisando';await salvar(ideia);}
 }
}

function ativarSelecao(visiveis,rotulo,recarregar){
 const sel=new Set(),barra=$('#barra-sel');
 const atualizar=()=>{
  const ids=visiveis().map(i=>i.id);
  for(const id of [...sel])if(!ids.includes(id))sel.delete(id);
  document.querySelectorAll('[data-sel]').forEach(c=>{c.checked=sel.has(c.dataset.sel);c.closest('.card')?.classList.toggle('marcado',c.checked);});
  barra.innerHTML=sel.size?`<span>${sel.size} selecionado(s)</span><button class="mini fix" data-a="selTodos">Selecionar todos (${ids.length})</button><button class="mini q fix" data-a="selApagar">🗑 Apagar</button><button class="mini fix" data-a="selLimpar">Cancelar</button>`:'';
  barra.style.display=sel.size?'flex':'none';
 };
 $('#lista').addEventListener('change',e=>{const id=e.target.dataset?.sel;if(!id)return;e.target.checked?sel.add(id):sel.delete(id);atualizar();});
 acoes.selTodos=()=>{visiveis().forEach(i=>sel.add(i.id));atualizar();};
 acoes.selLimpar=()=>{sel.clear();atualizar();};
 acoes.selApagar=async()=>{
  const itens=visiveis().filter(i=>sel.has(i.id));if(!itens.length)return;
  if(!confirm(`Apagar ${itens.length} ${rotulo}? A exclusão também vai para os outros aparelhos.`))return;
  for(const it of itens)await excluirItem(it);

 };
 return atualizar;
}

async function importarExterno(j,tipo){
 const lista=Array.isArray(j)?j:(j.itens||j.outliers||j.pautas||j.dados||j.items||[j]);
 const existentes=new Set((await DB.all('itens')).map(i=>i.origem_id).filter(Boolean));
 const usados=['id','origem_id','codigo','titulo','title','tema','nome','pauta','link','url','video_url','videoUrl','nota','notas','descricao','observacoes','pilar'];
 let n=0;
 for(const o of lista){if(!o||typeof o!=='object')continue;
  const oid=String(o.id??o.origem_id??o.codigo??'')||null;if(oid&&existentes.has(oid))continue;
  const link=o.link||o.url||o.video_url||o.videoUrl||'';
  const extras=Object.entries(o).filter(([k,v])=>!usados.includes(k)&&v!==''&&v!=null&&typeof v!=='object').map(([k,v])=>`${k}: ${v}`).join('\n');
  const nota=[o.nota||o.notas||o.descricao||o.observacoes||'',extras?`— Dados de origem (${tipo}) —\n${extras}`:''].filter(Boolean).join('\n\n');
  await salvar(novaIdeia({titulo:String(o.titulo||o.title||o.tema||o.nome||o.pauta||'(sem título)'),nota,links:link?[String(link)]:[],pilar:o.pilar||'',origem:tipo==='outlier'?'outlier':'própria',origem_id:oid,tags:[tipo]}));
  if(oid)existentes.add(oid);n++;}
 return n;
}

 acoes.sair=async()=>{await Sync.sair();telaConfig();};
 acoes.syncAgora=async()=>toast(await Sync.sincronizar()?'Sincronizado':'Falha na sincronização (veja o console)');
 acoes.expAgente=async()=>{const l=(await itensAtivos()).sort((a,b)=>a.tipo.localeCompare(b.tipo));exportarAgente(l,`obra-ciencia-agente-${hoje()}.json`);};
 acoes.backup=backupCompleto;
  acoes.imp=el=>{const tipo=el.dataset.v,txt=$('#imp-txt').value.trim();
  const processar=async texto=>{try{const j=JSON.parse(texto);
   if(tipo==='pauta')return await previaPlano(j);
   const n=tipo==='backup'?await importarBackup(j):await importarExterno(j,tipo);
   toast(`${n} item(ns) importado(s)`);$('#imp-txt').value='';}catch(e){alert('Erro ao importar: '+e.message);}};
  txt?processar(txt):escolherJSON(processar);};
}

// ================= INICIALIZAÇÃO =================
window.addEventListener('sync:atualizado',()=>{const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;render();});
window.addEventListener('hashchange',render);
window.addEventListener('beforeunload',salvarPendentes);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')salvarPendentes();});
$('#sync-status').addEventListener('click',()=>Sync.sincronizar());
navigator.storage?.persist?.();
render();
Sync.iniciar();
</script>
